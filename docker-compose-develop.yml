version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: imgflux-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=imgflux
      - MYSQL_USER=imgflux
      - MYSQL_PASSWORD=imgflux123
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: imgflux-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  imgflux-upload-api:
    image: cloudmediaforge/imgflux-upload-api:latest
    container_name: imgflux-upload-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILE=develop
      - DB_URL=jdbc:mysql://mysql:3306/imgflux
      - DB_USERNAME=imgflux
      - DB_PASSWD=imgflux123
      - IMGFLUX_STORAGE_TYPE=minio
      - IMGFLUX_STORAGE_BUCKET=original-image
      - IMGFLUX_STORAGE_ENDPOINT=http://minio:9000
      - IMGFLUX_STORAGE_ACCESS_KEY=minioadmin
      - IMGFLUX_STORAGE_SECRET_KEY=minioadmin
      - IMGFLUX_STORAGE_REGION=
      - IMGFLUX_CDN_BASE_URL=http://localhost:9001
      - IMGFLUX_CDN_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

  imgflux-download-api:
    image: cloudmediaforge/imgflux-download-api:latest
    container_name: imgflux-download-api
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILE=develop
      - DB_URL=jdbc:mysql://mysql:3306/imgflux
      - DB_USERNAME=imgflux
      - DB_PASSWD=imgflux123
      - IMGFLUX_STORAGE_TYPE=minio
      - IMGFLUX_STORAGE_BUCKET=original-image
      - IMGFLUX_STORAGE_ENDPOINT=http://minio:9000
      - IMGFLUX_STORAGE_ACCESS_KEY=minioadmin
      - IMGFLUX_STORAGE_SECRET_KEY=minioadmin
      - IMGFLUX_STORAGE_REGION=
      - IMGFLUX_CDN_BASE_URL=http://localhost:9001
      - IMGFLUX_CDN_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

  imgflux-admin-ui:
    image: cloudmediaforge/imgflux-admin:latest
    container_name: imgflux-admin-ui
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILE=develop
      - DB_URL=jdbc:mysql://mysql:3306/imgflux
      - DB_USERNAME=imgflux
      - DB_PASSWD=imgflux123
      - IMGFLUX_STORAGE_TYPE=minio
      - IMGFLUX_STORAGE_BUCKET=original-image
      - IMGFLUX_STORAGE_ENDPOINT=http://minio:9000
      - IMGFLUX_STORAGE_ACCESS_KEY=minioadmin
      - IMGFLUX_STORAGE_SECRET_KEY=minioadmin
      - IMGFLUX_STORAGE_REGION=
      - IMGFLUX_CDN_BASE_URL=http://localhost:9001
      - IMGFLUX_CDN_API_KEY=
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      imgflux-upload-api:
        condition: service_started
      imgflux-download-api:
        condition: service_started

volumes:
  mysql-data:
    driver: local
  minio-data:
    driver: local

networks:
  default:
    name: imgflux-develop-network
