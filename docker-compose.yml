version: '3.8'

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: imgflux-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Image Upload API
  imgFlux-upload-api:
    image: cloudmediaforge/imgflux-upload-api:latest
    container_name: imgflux-upload-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config

  # Image Download API
  imgFlux-download-api:
    image: cloudmediaforge/imgflux-download-api:latest
    container_name: imgflux-download-api
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config

  # Image Admin UI
  imgFlux-admin-ui:
    image: cloudmediaforge/imgflux-admin:latest
    container_name: imgflux-admin-ui
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      minio:
        condition: service_healthy
      imgFlux-upload-api:
        condition: service_started
      imgFlux-download-api:
        condition: service_started
    volumes:
      - ./config:/app/config

volumes:
  minio-data:
    driver: local

networks:
  default:
    name: imgflux-network
