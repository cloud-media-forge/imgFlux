<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Images - Image Service Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">Image Service Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" th:text="'Welcome, ' + ${user.username}"></span>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action">Dashboard</a>
                    <a th:href="@{/admin/images}" class="list-group-item list-group-item-action active">My Images</a>
                    <a th:href="@{/admin/upload}" class="list-group-item list-group-item-action">Upload Image</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>My Images</h2>
                    <a th:href="@{/admin/upload}" class="btn btn-primary">Upload New Image</a>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Dimensions</th>
                                <th>Size</th>
                                <th>Uploaded</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="image : ${images}">
                                <td>
                                    <!-- 显示缩略图 -->
                                    <img th:src="@{'/api/download/' + ${image.fileHash} + '?width=50&height=50'}" 
                                         alt="Thumbnail" class="img-thumbnail" style="width: 50px; height: 50px;">
                                </td>
                                <td th:text="${image.fileName}">Filename</td>
                                <td>
                                    <span th:text="${image.width}">Width</span> x 
                                    <span th:text="${image.height}">Height</span>
                                </td>
                                <td th:text="${#numbers.formatDecimal(image.fileSize / 1024.0, 1, 2) + ' KB'}">Size</td>
                                <td th:text="${#temporals.format(image.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                                <td>
                                    <a th:href="@{/admin/images/{id}(id=${image.id})}" class="btn btn-sm btn-outline-primary">View</a>
                                    <button class="btn btn-sm btn-outline-danger" disabled>Delete</button>
                                </td>
                            </tr>
                            <tr th:if="${images.empty}">
                                <td colspan="6" class="text-center">No images found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
